<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WeatherWeb — Ứng dụng thời tiết immersive, serverless" />
  <title>WeatherWeb ⛅ Dự báo Thời tiết</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@2.1.0/dist/leaflet-velocity.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="app-header">
    <a href="#" class="logo">⛅ WeatherWeb</a>

    <div id="search-wrapper">
      <input
        id="search-input"
        type="text"
        placeholder="Tìm thành phố... (VD: Hà Nội, Bangkok)"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="btn-search" title="Tìm kiếm">
        <span id="search-icon">🔍</span>
        <span id="search-spinner" class="spinner hidden"></span>
      </button>
      <button id="btn-location" title="Vị trí của tôi">📍</button>
      <div id="history-dropdown" class="hidden"></div>
    </div>

    <div class="header-controls">
      <div class="unit-toggle">
        <button id="btn-unit-c" class="unit-btn unit-active">°C</button>
        <button id="btn-unit-f" class="unit-btn">°F</button>
      </div>
      <button id="btn-theme" title="Đổi giao diện">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </header>

  <div id="weather-map"></div>

  <div id="layer-picker">
    <button class="map-layer-btn active" data-layer="precipitation_new">🌧 Mưa</button>
    <button class="map-layer-btn" data-layer="clouds_new">☁️ Mây</button>
    <button class="map-layer-btn" data-layer="temp_new">🌡 Nhiệt độ</button>
    <button class="map-layer-btn" data-layer="wind_new">💨 Gió</button>
    <button class="map-layer-btn" data-layer="pressure_new">📊 Áp suất</button>
  </div>

  <div id="toast" class="toast" role="alert" aria-live="polite">
    <span class="toast__icon"></span>
    <span class="toast__message"></span>
  </div>

  <script src="js/config.client.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity@2.1.0/dist/leaflet-velocity.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/api-openmeteo.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/ui/current.js"></script>
  <script src="js/ui/forecast.js"></script>
  <script src="js/ui/side-panel.js"></script>
  <script src="js/ui/timeline.js"></script>
  <script src="js/ui/search-autocomplete.js"></script>
  <script src="js/layers/wind-layer.js"></script>
  <script src="js/layers/radar.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
